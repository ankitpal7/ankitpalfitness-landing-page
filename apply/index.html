  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Free 1:1 Strategy Call | Ankit Pal Fitness</title>
  <meta name="description" content="Pick a time below for your free 30-minute strategy call with Coach Ankit Pal.">
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/style.css">

  <style>
    .apply-hero{padding:34px 0 28px;}
    .calendly-section{padding:0 0 50px;background:var(--cream);}
    .calendly-card{
      max-width:760px;
      margin:-18px auto 0;
      background:#fff;
      border-radius:16px;
      overflow:hidden;
      box-shadow:0 16px 40px rgba(16,27,43,0.18);
      border:1px solid var(--cream-deep);
    }
    .calendly-inline-widget{min-width:320px;height:700px;}
    .apply-trust{display:flex;justify-content:center;gap:18px;flex-wrap:wrap;margin-top:18px;font-size:12.5px;color:var(--ink-soft);font-weight:600;}
    .apply-trust span{display:flex;align-items:center;gap:6px;}
    .apply-trust span::before{content:'✓';color:var(--terra-500);font-weight:800;}
  </style>
</head>
<body>

<section class="hero apply-hero">
  <div class="container hero-inner">
    <div class="hero-badge">Step 1 of 2 — Pick your slot</div>
    <h1>Book Your Free <span class="accent">1:1 Strategy Call</span></h1>
    <p class="sub">Choose a time that works for you below — it takes less than a minute to lock in your spot.</p>
  </div>
</section>

<section class="calendly-section">
  <div class="container">
    <div class="calendly-card">
      <!-- Calendly inline widget begin -->
      <div class="calendly-inline-widget" data-url="https://calendly.com/ankitpalfitness/30min" style="min-width:320px;height:700px;"></div>
      <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
      <!-- Calendly inline widget end -->
    </div>
    <div class="apply-trust">
      <span>100% free, no obligation</span>
      <span>30-minute call</span>
      <span>Confirmation by email &amp; WhatsApp</span>
    </div>
  </div>
</section>

<script>
  // Listen for Calendly booking completion and redirect to thank you page
  // NOTE: Schedule pixel fires on /call-scheduled/ page load only (not here)
  // This prevents double-counting in Meta Ads Manager
  window.addEventListener('message', function (e) {
    if (e.origin !== 'https://calendly.com') return;
    if (!e.data || !e.data.event) return;

    if (e.data.event === 'calendly.event_scheduled') {
      setTimeout(function () {
        window.location.href = '/call-scheduled/';
      }, 800);
    }
  });
</script>

</body>
</html>
